<div class="settings">
  <div class="settings__header">
    <h1 class="settings__title">{{ 'SETTINGS.TITLE' | t }}</h1>
    <p class="settings__subtitle">{{ 'SETTINGS.SUBTITLE' | t }}</p>
  </div>

  <div class="settings__grid">
    <!-- Theme Settings Card -->
    <div class="settings-card">
      <div class="settings-card__body">
        <h2 class="settings-card__title">{{ 'SETTINGS.THEME' | t }}</h2>
        <p class="settings-card__description">{{ 'SETTINGS.THEME_DESCRIPTION' | t }}</p>
      </div>
      <div class="settings-card__footer">
        <app-theme-toggle mode="segment" />
      </div>
    </div>

    <!-- Language Settings Card -->
    <div class="settings-card">
      <div class="settings-card__body">
        <h2 class="settings-card__title">{{ 'SETTINGS.LANGUAGE' | t }}</h2>
        <p class="settings-card__description">{{ 'SETTINGS.LANGUAGE_DESCRIPTION' | t }}</p>
      </div>
      <div class="settings-card__footer">
        <app-language-switcher />
      </div>
    </div>

    @if (isAdmin()) {
      <!-- Admin Panel Card -->
      <div class="settings-card">
        <div class="settings-card__body">
          <h2 class="settings-card__title">{{ 'SETTINGS.ADMIN_PANEL' | t }}</h2>
          <p class="settings-card__description">{{ 'SETTINGS.ADMIN_DESCRIPTION' | t }}</p>
        </div>
        <div class="settings-card__footer">
          <button type="button" class="settings-card__action-btn" (click)="goToAdminPanel()">
            {{ 'SETTINGS.OPEN' | t }}
          </button>
        </div>
      </div>
    }
  </div>

  <div class="settings__footer">
    <button type="button" class="settings__back-btn" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path
          d="M15 18L9 12L15 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      {{ 'SETTINGS.BACK_TO_DASHBOARD' | t }}
    </button>
  </div>
</div>
