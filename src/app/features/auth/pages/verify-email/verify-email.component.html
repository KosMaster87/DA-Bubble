<div class="verify-email">
  <div class="verify-email__container">
    <header class="verify-email__header">
      <h1 class="verify-email__title">{{ 'AUTH.VERIFY_EMAIL' | t }}</h1>
      <p
        class="verify-email__subtitle"
        [innerHTML]="'AUTH.VERIFY_EMAIL_SUBTITLE' | t: { email: userEmail() }"
      ></p>
    </header>

    <section class="verify-email__instructions">
      <div class="verify-email__icon">
        <img src="/img/mail.svg" alt="Email" />
      </div>
      <p class="verify-email__text">{{ 'AUTH.VERIFY_EMAIL_INSTRUCTIONS' | t }}</p>
      <p class="verify-email__text verify-email__text--small">
        {{ 'AUTH.VERIFY_EMAIL_AFTER' | t }}
      </p>
    </section>

    <div class="verify-email__actions">
      <app-primary-button
        [label]="'AUTH.I_VERIFIED' | t"
        [loading]="isChecking()"
        (clicked)="checkVerification()"
      />

      @if (emailSent()) {
        <p class="verify-email__success">✓ {{ 'NOTIFICATIONS.VERIFY_EMAIL_RESENT' | t }}</p>
      } @else {
        <app-guest-button
          [label]="'AUTH.RESEND_VERIFICATION' | t"
          (clicked)="resendVerificationEmail()"
        />
      }

      <app-secondary-button [label]="'AUTH.BACK_TO_SIGNIN' | t" (clicked)="goToSignin()" />
    </div>
  </div>
</div>
