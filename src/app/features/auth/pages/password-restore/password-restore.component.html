<div class="password-restore">
  <div class="password-restore__container">
    <header class="password-restore__header">
      <h1 class="password-restore__title">{{ 'AUTH.SET_NEW_PASSWORD' | t }}</h1>
      <p class="password-restore__subtitle">{{ 'AUTH.PASSWORD_RESTORE_SUBTITLE' | t }}</p>
    </header>

    <form [formGroup]="restoreForm" (ngSubmit)="onSubmit()" class="password-restore__form">
      <app-input-field
        [control]="$any(restoreForm.controls['password'])"
        id="password"
        [type]="hidePassword() ? 'password' : 'text'"
        [placeholder]="'AUTH.NEW_PASSWORD_PLACEHOLDER' | t"
        icon="/img/formfield/lock-default.svg"
        [errorMessages]="passwordErrors()"
      />

      <app-input-field
        [control]="$any(restoreForm.controls['confirmPassword'])"
        id="confirmPassword"
        [type]="hideConfirmPassword() ? 'password' : 'text'"
        [placeholder]="'AUTH.CONFIRM_PASSWORD_PLACEHOLDER' | t"
        icon="/img/formfield/lock-default.svg"
        [errorMessages]="confirmPasswordErrors()"
      />

      @if (!passwordsMatch() && restoreForm.get('confirmPassword')?.touched) {
        <p class="password-restore__error">{{ 'AUTH.ERROR_PASSWORDS_MATCH' | t }}</p>
      }

      <div class="password-restore__button-wrapper">
        <app-primary-button
          type="submit"
          [label]="'AUTH.RESET_PASSWORD_BTN' | t"
          [disabled]="restoreForm.invalid || !passwordsMatch() || isSubmitting()"
          [loading]="isSubmitting()"
        />
      </div>
    </form>
  </div>
</div>
