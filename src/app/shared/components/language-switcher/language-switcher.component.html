<div class="language-switcher" role="group" aria-label="Language selection">
  @for (lang of languages; track lang.code) {
    <button
      type="button"
      class="language-switcher__btn"
      [class.language-switcher__btn--active]="i18n.currentLang() === lang.code"
      (click)="setLanguage(lang.code)"
      [attr.aria-label]="'Switch to ' + lang.label"
      [title]="lang.label"
    >
      <span class="language-switcher__flag">{{ lang.flag }}</span>
      <span class="language-switcher__label">{{ lang.label }}</span>
    </button>
  }
</div>
