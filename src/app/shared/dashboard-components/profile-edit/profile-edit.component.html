@if (isVisible()) {
  <div class="profile-edit">
    <div class="profile-edit__overlay" (click)="onClose()"></div>
    <div class="profile-edit__content">
      <!-- Header -->
      <div class="profile-edit__header">
        <h2 class="profile-edit__title">Profil bearbeiten</h2>
        <button
          class="profile-edit__close-btn"
          (click)="onClose()"
          [attr.aria-label]="'Close edit profile'"
        >
          <svg class="profile-edit__close-icon" viewBox="0 0 14 14" aria-hidden="true">
            <path
              d="M6.575 7.975L1.675 12.875C1.49167 13.0583 1.25833 13.15 0.975 13.15C0.691667 13.15 0.458333 13.0583 0.275 12.875C0.0916663 12.6917 0 12.4583 0 12.175C0 11.8917 0.0916663 11.6583 0.275 11.475L5.175 6.575L0.275 1.675C0.0916663 1.49167 0 1.25833 0 0.975C0 0.691667 0.0916663 0.458333 0.275 0.275C0.458333 0.0916663 0.691667 0 0.975 0C1.25833 0 1.49167 0.0916663 1.675 0.275L6.575 5.175L11.475 0.275C11.6583 0.0916663 11.8917 0 12.175 0C12.4583 0 12.6917 0.0916663 12.875 0.275C13.0583 0.458333 13.15 0.691667 13.15 0.975C13.15 1.25833 13.0583 1.49167 12.875 1.675L7.975 6.575L12.875 11.475C13.0583 11.6583 13.15 11.8917 13.15 12.175C13.15 12.4583 13.0583 12.6917 12.875 12.875C12.6917 13.0583 12.4583 13.15 12.175 13.15C11.8917 13.15 11.6583 13.0583 11.475 12.875L6.575 7.975Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="profile-edit__body">
        <!-- Avatar -->
        <div class="profile-edit__avatar-wrapper">
          @if (user().photoURL) {
            <img
              [src]="user().photoURL"
              [alt]="user().displayName"
              class="profile-edit__avatar-img"
            />
          } @else {
            <div class="profile-edit__avatar-placeholder">
              {{ user().displayName.charAt(0).toUpperCase() }}
            </div>
          }

          <!-- Avatar Edit -->
          <button class="profile-edit__avatar-edit-btn">
            <svg class="profile-edit__icon" viewBox="0 0 19 19" aria-hidden="true">
              <path
                d="M2 16.25H3.4L12.025 7.625L10.625 6.225L2 14.85V16.25ZM16.3 6.175L12.05 1.975L13.45 0.575C13.8333 0.191667 14.3043 0 14.863 0C15.421 0 15.8917 0.191667 16.275 0.575L17.675 1.975C18.0583 2.35833 18.2583 2.821 18.275 3.363C18.2917 3.90433 18.1083 4.36667 17.725 4.75L16.3 6.175ZM1 18.25C0.716667 18.25 0.479333 18.154 0.288 17.962C0.0960001 17.7707 0 17.5333 0 17.25V14.425C0 14.2917 0.025 14.1627 0.075 14.038C0.125 13.9127 0.2 13.8 0.3 13.7L10.6 3.4L14.85 7.65L4.55 17.95C4.45 18.05 4.33767 18.125 4.213 18.175C4.08767 18.225 3.95833 18.25 3.825 18.25H1Z"
                fill="currentColor"
              />
            </svg>
            <span class="profile-edit__avatar-edit-text">Change avatar</span>
          </button>
        </div>

        <!-- Admin Status (read-only: role changes go through the Admin Panel / channel
             member menu now, not this form) -->
        <div class="profile-edit__field">
          <div
            class="profile-edit__radio-row"
            title="Manage admin status from the Admin Panel or the channel member menu"
          >
            <img
              [src]="
                isAdmin()
                  ? '/img/icon/channel-bar/radio-btn-checked.svg'
                  : '/img/icon/channel-bar/radio-btn-default.svg'
              "
              alt=""
              class="profile-edit__radio-icon"
            />
            <label class="profile-edit__radio-label">Admin</label>
          </div>
        </div>

        <!-- Full Name -->
        <div class="profile-edit__field">
          <div class="profile-edit__field-label">
            <svg class="profile-edit__icon" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M3.85 15.1C4.7 14.45 5.65 13.9373 6.7 13.562C7.75 13.1873 8.85 13 10 13C11.15 13 12.25 13.1873 13.3 13.562C14.35 13.9373 15.3 14.45 16.15 15.1C16.7333 14.4167 17.1877 13.6417 17.513 12.775C17.8377 11.9083 18 10.9833 18 10C18 7.78333 17.221 5.89567 15.663 4.337C14.1043 2.779 12.2167 2 10 2C7.78333 2 5.896 2.779 4.338 4.337C2.77933 5.89567 2 7.78333 2 10C2 10.9833 2.16267 11.9083 2.488 12.775C2.81267 13.6417 3.26667 14.4167 3.85 15.1ZM10 11C9.01667 11 8.18733 10.6627 7.512 9.988C6.83733 9.31267 6.5 8.48333 6.5 7.5C6.5 6.51667 6.83733 5.68733 7.512 5.012C8.18733 4.33733 9.01667 4 10 4C10.9833 4 11.8127 4.33733 12.488 5.012C13.1627 5.68733 13.5 6.51667 13.5 7.5C13.5 8.48333 13.1627 9.31267 12.488 9.988C11.8127 10.6627 10.9833 11 10 11ZM10 20C8.61667 20 7.31667 19.7373 6.1 19.212C4.88333 18.6873 3.825 17.975 2.925 17.075C2.025 16.175 1.31267 15.1167 0.788 13.9C0.262667 12.6833 0 11.3833 0 10C0 8.61667 0.262667 7.31667 0.788 6.1C1.31267 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.31233 6.1 0.787C7.31667 0.262333 8.61667 0 10 0C11.3833 0 12.6833 0.262333 13.9 0.787C15.1167 1.31233 16.175 2.025 17.075 2.925C17.975 3.825 18.6873 4.88333 19.212 6.1C19.7373 7.31667 20 8.61667 20 10C20 11.3833 19.7373 12.6833 19.212 13.9C18.6873 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6873 13.9 19.212C12.6833 19.7373 11.3833 20 10 20ZM10 18C10.8833 18 11.7167 17.871 12.5 17.613C13.2833 17.3543 14 16.9833 14.65 16.5C14 16.0167 13.2833 15.6457 12.5 15.387C11.7167 15.129 10.8833 15 10 15C9.11667 15 8.28333 15.129 7.5 15.387C6.71667 15.6457 6 16.0167 5.35 16.5C6 16.9833 6.71667 17.3543 7.5 17.613C8.28333 17.871 9.11667 18 10 18ZM10 9C10.4333 9 10.7917 8.85833 11.075 8.575C11.3583 8.29167 11.5 7.93333 11.5 7.5C11.5 7.06667 11.3583 6.70833 11.075 6.425C10.7917 6.14167 10.4333 6 10 6C9.56667 6 9.20833 6.14167 8.925 6.425C8.64167 6.70833 8.5 7.06667 8.5 7.5C8.5 7.93333 8.64167 8.29167 8.925 8.575C9.20833 8.85833 9.56667 9 10 9Z"
                fill="currentColor"
              />
            </svg>
            <span class="profile-edit__label">Full name</span>
          </div>
          <input
            type="text"
            class="profile-edit__input"
            placeholder="Your name here"
            [value]="displayName()"
            (input)="onDisplayNameChange($event)"
          />
        </div>
      </div>

      <!-- Footer -->
      <div class="profile-edit__footer">
        <app-btn-cancel label="Cancel" (clicked)="onCancel()" />
        <app-btn-action label="Save" [disabled]="isSaveDisabled()" (clicked)="onSave()" />
      </div>
    </div>
  </div>
}
