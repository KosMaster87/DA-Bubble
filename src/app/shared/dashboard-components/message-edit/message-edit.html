<div class="message-edit-wrapper">
  <div class="message-edit">
    <!-- Textarea Row -->
    <div class="message-edit__textarea-wrapper">
      <textarea
        class="message-edit__textarea"
        #editTextarea
        [value]="editedContent()"
        (input)="onInput($event)"
        placeholder="Edit your message..."
        rows="3"
      ></textarea>
    </div>

    <!-- Actions Row -->
    <div class="message-edit__actions">
      <!-- Left: Add Reaction Button -->
      <div class="message-edit__emoji-wrapper">
        <button
          class="message-edit__emoji-btn"
          type="button"
          aria-label="Add emoji"
          [attr.aria-expanded]="isEmojiPickerOpen()"
          (click)="toggleEmojiPicker()"
        >
          <img
            src="/img/icon/emojis/emoji-add-reaction-default.svg"
            alt=""
            class="message-edit__emoji-icon"
          />
        </button>

        @if (isEmojiPickerOpen()) {
          <div class="message-edit__emoji-picker" role="group" aria-label="Choose an emoji">
            @for (emoji of emojis; track emoji.value) {
              <button
                class="message-edit__emoji-option"
                type="button"
                [attr.aria-label]="emoji.label"
                (click)="onEmojiSelect(emoji.value)"
              >
                {{ emoji.value }}
              </button>
            }
          </div>
        }
      </div>

      <!-- Right: Cancel and Save Buttons -->
      <div class="message-edit__buttons">
        <app-btn-cancel (click)="onCancel()" />
        <app-btn-action text="Save" (click)="onSave()" />
      </div>
    </div>
  </div>
</div>
